name: Release

# Push a tag like v1.2.0 to build VanishCam.exe and publish it as a GitHub release.
# Run it by hand (Actions → Release → Run workflow) to only build and download the EXE.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Download the MediaPipe models
        run: python -c "from vanishcam.models import download_models; download_models()"

      - name: Build
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/VanishCam.spec

      - name: Self-test the EXE
        run: dist\VanishCam.exe --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: VanishCam
          path: dist/VanishCam.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/VanishCam.exe --title "VanishCam ${{ github.ref_name }}" --generate-notes
